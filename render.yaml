# =========================================================
# PENUMBRA — Blueprint de Render (https://render.com)
# Render → New → Blueprint → elige el repositorio.
# Un solo servicio web gratis con el Dockerfile: Node + PHP +
# MariaDB (MySQL) dentro del mismo contenedor, con HTTPS y
# WebSocket. En el plan gratis los puntajes se reinician cuando
# el servicio se duerme o se vuelve a desplegar.
# =========================================================
services:
  - type: web
    name: penumbra
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: FACEBOOK_APP_ID
        value: "2221477365083151"
      - key: FACEBOOK_APP_SECRET   # opcional: Meta → tu app → Configuración → Básica
        sync: false
