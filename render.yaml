# =========================================================
# PENUMBRA — Blueprint de Render (https://render.com)
# Render → New → Blueprint → elige el repositorio. Crea el
# servicio web gratis con el Dockerfile (Node + PHP, HTTPS y
# WebSocket). La base MySQL va en Aiven (gratis): pega su
# "Service URI" en DATABASE_URL. Ver la sección "Hostear" del README.
# =========================================================
services:
  - type: web
    name: penumbra
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL          # mysql://avnadmin:…@mysql-….aivencloud.com:PUERTO/defaultdb?ssl-mode=REQUIRED
        sync: false
      - key: DB_SSL_CA_PEM         # opcional: el "CA certificate" de Aiven para verificar el SSL
        sync: false
      - key: FACEBOOK_APP_ID
        value: "2221477365083151"
      - key: FACEBOOK_APP_SECRET   # opcional: Meta → tu app → Configuración → Básica
        sync: false
